<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bury Bella</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            z-index: 1;
        }

        .mobile-image {
            display: none;
        }

        .desktop-image {
            object-fit: contain;
            object-position: center center;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-top: 30vh;
        }

        .shop-button {
            padding: 20px 50px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .shop-button:hover {
            background-color: #333;
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .shop-button:active {
            transform: translateY(-2px);
        }

        .side-flow {
            position: absolute;
            top: 0;
            width: 12vw;
            max-width: 160px;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .side-flow-left {
            left: 0;
        }

        .side-flow-right {
            right: 0;
        }

        .side-flow text {
            fill: rgba(255, 255, 255, 0.35);
            font-family: 'Arial', sans-serif;
            font-weight: 300;
            font-size: 20px;
            letter-spacing: 4px;
        }

        /* Mobil responsive */
        @media (max-width: 768px) {
            .shop-button {
                padding: 15px 40px;
                font-size: 18px;
                letter-spacing: 1px;
            }

            .content {
                margin-top: 40vh;
            }

            .background-image {
                object-position: center 20%;
            }

            .desktop-image {
                display: none;
            }

            .mobile-image {
                display: block;
            }

            .side-flow {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .shop-button {
                padding: 12px 30px;
                font-size: 16px;
            }

            .background-image {
                object-position: center 15%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="side-flow side-flow-left" viewBox="0 0 200 1200" preserveAspectRatio="xMidYMid slice">
            <path id="flowPathLeft" d="M100,0 C180,120 20,240 100,360 C180,480 20,600 100,720 C180,840 20,960 100,1080 C180,1200 20,1200 100,1200" fill="none"/>
            <text>
                <textPath href="#flowPathLeft" startOffset="0">DROP LIVE • DROP LIVE • DROP LIVE • DROP LIVE • DROP LIVE • DROP LIVE • DROP LIVE •</textPath>
            </text>
        </svg>

        <img src="computer.jpg" alt="Bury Bella" class="background-image desktop-image">
        <img src="telephone.jpg" alt="Bury Bella" class="background-image mobile-image">

        <svg class="side-flow side-flow-right" viewBox="0 0 200 1200" preserveAspectRatio="xMidYMid slice">
            <path id="flowPathRight" d="M100,0 C20,120 180,240 100,360 C20,480 180,600 100,720 C20,840 180,960 100,1080 C20,1200 180,1200 100,1200" fill="none"/>
            <text>
                <textPath href="#flowPathRight" startOffset="0">DROP LIVE • DROP LIVE • DROP LIVE • DROP LIVE • DROP LIVE • DROP LIVE • DROP LIVE •</textPath>
            </text>
        </svg>

        <div class="content">
            <button class="shop-button" onclick="shopNow()">Shop Now</button>
        </div>
    </div>

    <script>
        function shopNow() {
            window.location.href = 'https://shopier.com/burybella';
        }
    </script>
</body>
</html>
