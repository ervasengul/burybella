<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bury Bella</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            z-index: 1;
        }

        .mobile-image {
            display: none;
        }

        .desktop-image {
            object-fit: contain;
            object-position: center center;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-top: 30vh;
        }

        .shop-button {
            padding: 20px 50px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .shop-button:hover {
            background-color: #333;
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .shop-button:active {
            transform: translateY(-2px);
        }

        .side-flow {
            position: absolute;
            top: 0;
            width: 12vw;
            max-width: 160px;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .side-flow-left {
            left: 0;
        }

        .side-flow-right {
            right: 0;
        }

        .side-flow-track {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: flowDown 180s linear infinite;
        }

        .side-flow-track span {
            display: block;
            color: #fff;
            font-family: 'Arial', sans-serif;
            font-weight: 600;
            font-size: 40px;
            padding: 16px 0;
        }

        .side-flow-track .flow-gap {
            display: block;
            height: 48px;
        }

        @keyframes flowDown {
            0% {
                transform: translateY(-50%);
            }
            100% {
                transform: translateY(0%);
            }
        }

        .mobile-flow {
            display: none;
            position: absolute;
            left: 0;
            width: 100%;
            height: 56px;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        .mobile-flow-top {
            top: 0;
        }

        .mobile-flow-bottom {
            bottom: 0;
        }

        .mobile-flow-track {
            display: flex;
            flex-direction: row;
            align-items: center;
            height: 100%;
            animation: flowRight 18s linear infinite;
        }

        .mobile-flow-track span {
            display: block;
            color: #fff;
            font-family: 'Arial', sans-serif;
            font-weight: 300;
            font-size: 32px;
            letter-spacing: 3px;
            white-space: nowrap;
            padding: 0 20px;
        }

        @keyframes flowRight {
            0% {
                transform: translateX(-50%);
            }
            100% {
                transform: translateX(0%);
            }
        }

        /* Mobil responsive */
        @media (max-width: 768px) {
            .shop-button {
                padding: 15px 40px;
                font-size: 18px;
                letter-spacing: 1px;
            }

            .content {
                margin-top: 28vh;
            }

            .background-image {
                object-position: center 20%;
            }

            .desktop-image {
                display: none;
            }

            .mobile-image {
                display: block;
            }

            .side-flow {
                display: none;
            }

            .mobile-flow {
                display: block;
            }
        }

        @media (max-width: 480px) {
            .shop-button {
                padding: 12px 30px;
                font-size: 16px;
            }

            .background-image {
                object-position: center 15%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="side-flow side-flow-left">
            <div class="side-flow-track" id="flowTrackLeft"></div>
        </div>

        <img src="computer.jpg" alt="Bury Bella" class="background-image desktop-image">
        <img src="telephone.jpg" alt="Bury Bella" class="background-image mobile-image">

        <div class="side-flow side-flow-right">
            <div class="side-flow-track" id="flowTrackRight"></div>
        </div>

        <div class="mobile-flow mobile-flow-top">
            <div class="mobile-flow-track" id="flowTrackMobileTop"></div>
        </div>

        <div class="mobile-flow mobile-flow-bottom">
            <div class="mobile-flow-track" id="flowTrackMobileBottom"></div>
        </div>

        <div class="content">
            <button class="shop-button" onclick="shopNow()">Shop Now</button>
        </div>
    </div>

    <script>
        function shopNow() {
            window.location.href = 'https://shopier.com/burybella';
        }

        function buildFlowTrack(id) {
            const track = document.getElementById(id);
            const word = 'DROP LIVE ';
            let items = '';
            for (let i = 0; i < 20; i++) {
                for (const char of word) {
                    items += char === ' ' ? '<span class="flow-gap"></span>' : '<span>' + char + '</span>';
                }
            }
            track.innerHTML = items + items;
        }

        function buildHorizontalFlowTrack(id) {
            const track = document.getElementById(id);
            let items = '';
            for (let i = 0; i < 20; i++) {
                items += '<span>DROP LIVE</span>';
            }
            track.innerHTML = items + items;
        }

        buildFlowTrack('flowTrackLeft');
        buildFlowTrack('flowTrackRight');
        buildHorizontalFlowTrack('flowTrackMobileTop');
        buildHorizontalFlowTrack('flowTrackMobileBottom');
    </script>
</body>
</html>
